<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFL Virtual Soccer - Pure Event-Driven Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.8;
            margin-bottom: 20px;
        }

        .connection-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card h3 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            color: #fbbf24;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cbd5e1;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }

        .status {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            margin-bottom: 16px;
        }

        .status.connected {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status.disconnected {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .live-match {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .live-match::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="pitch" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23pitch)"/></svg>');
            opacity: 0.1;
        }

        .live-match-content {
            position: relative;
            z-index: 1;
        }

        .match-header {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .match-score {
            font-size: 4rem;
            font-weight: 900;
            margin: 20px 0;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .match-time {
            font-size: 1.5rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .match-status {
            display: inline-block;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .events-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .events-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .events-header {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            font-weight: 700;
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .events-list {
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .event-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            animation: slideIn 0.5s ease;
        }

        .event-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(4px);
        }

        .event-item.goal {
            border-left-color: #fbbf24;
            background: rgba(251, 191, 36, 0.1);
        }

        .event-item.card {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .event-item.corner {
            border-left-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .event-item.system {
            border-left-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .event-item.foul {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }

        /* Event-driven specific animations */
        @keyframes goalFlash {
            0% { background: rgba(76, 175, 80, 0.8); transform: scale(1); }
            50% { background: rgba(76, 175, 80, 1); transform: scale(1.05); }
            100% { background: rgba(76, 175, 80, 0.2); transform: scale(1); }
        }

        @keyframes eventDrivenPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        .event-item[data-event-driven="true"] {
            border-left-width: 6px;
            box-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .event-item[data-event-type="goal"] {
            animation: goalFlash 2s ease-in-out;
        }

        .event-time {
            font-weight: 700;
            color: #fbbf24;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .event-type {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
            margin-bottom: 8px;
            opacity: 0.8;
        }

        .event-description {
            font-size: 1rem;
            margin-bottom: 8px;
        }

        .event-details {
            font-size: 0.85rem;
            opacity: 0.7;
            font-style: italic;
        }

        .playoffs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .playoff-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .playoff-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .playoff-header {
            font-weight: 700;
            margin-bottom: 16px;
            color: #fbbf24;
        }

        .playoff-match {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .match-teams {
            font-weight: 500;
        }

        .match-events-mini {
            display: flex;
            gap: 4px;
            align-items: center;
            min-height: 18px;
        }

        .match-event-mini {
            display: inline-block;
            font-size: 12px;
            padding: 2px 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            cursor: help;
        }

        .no-events {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        .playoff-score {
            font-weight: 700;
            color: #10b981;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 900;
            color: #fbbf24;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 1rem;
            opacity: 0.8;
        }

        .event-icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes flash {
            0%, 100% { opacity: 1; }
            25% { opacity: 0.3; }
            50% { opacity: 1; }
            75% { opacity: 0.3; }
        }

        .scrollbar-thin {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb:hover {
            background-color: rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ VFL Virtual Soccer</h1>
            <p>⚡ Pure Event-Driven Mode - Zero Polling, Sub-10ms Event Delivery</p>
            <div id="connectionStatus" class="status disconnected">Disconnected</div>
        </div>

        <div class="connection-section">
            <div class="card">
                <h3>🔌 Connection</h3>
                <div class="input-group">
                    <label for="serverUrl">Server URL</label>
                    <input type="text" id="serverUrl" value="http://localhost:5000" placeholder="ws://localhost:5000">
                </div>
                <button class="btn btn-primary" onclick="connectToServer()" id="connectBtn">Connect</button>
                <button class="btn btn-danger" onclick="disconnectFromServer()" id="disconnectBtn" style="display: none;">Disconnect</button>
            </div>

            <div class="card">
                <h3>👤 Client Selection</h3>
                <div class="input-group">
                    <label for="clientSelect">Select Client</label>
                    <select id="clientSelect">
                        <option value="client_premier">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League Client</option>
                        <option value="client_spain">🇪🇸 La Liga Client</option>
                        <option value="client_germany">🇩🇪 Bundesliga Client</option>
                        <option value="client_italy">🇮🇹 Serie A Client</option>
                        <option value="client_france">🇫🇷 Ligue 1 Client</option>
                    </select>
                </div>
                <button class="btn btn-success" onclick="joinAsClient()" id="joinBtn" disabled>Join as Client</button>
            </div>
        </div>

        <div id="liveMatchSection" class="live-match" style="display: block;">
            <div class="live-match-content">
                <div class="match-header" id="matchHeader">No Live Matches Currently</div>
                <div class="match-score" id="matchScore">- - -</div>
                <div class="match-time" id="matchTime">--</div>
                <div class="match-status" id="matchStatus" style="color: #666; font-style: italic;">Waiting for matches to start...</div>
            </div>
        </div>



        <div id="playoffsSection" class="playoffs-grid" style="display: none;">
            <!-- Playoffs will be populated here -->
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        let socket = null;
        let currentClient = null;
        let liveEventCount = 0;
        let systemEventCount = 0;
        let totalEvents = 0;
        let totalGoals = 0;

        // Event type icons and classifications
        const eventIcons = {
            'goal': '⚽',
            'yellow_card': '🟨',
            'red_card': '🟥',
            'corner': '📐',
            'foul': '🚫',
            'offside': '🚷',
            'free_kick': '🦶',
            'match_start': '🏁',
            'first_half_end': '⏰',
            'second_half_start': '🔄',
            'match_end': '🏆'
        };

        const eventClasses = {
            'goal': 'goal',
            'yellow_card': 'card',
            'red_card': 'card',
            'corner': 'corner',
            'foul': 'foul',
            'offside': 'foul',
            'free_kick': 'foul',
            'match_start': 'system',
            'first_half_end': 'system',
            'second_half_start': 'system',
            'match_end': 'system'
        };

        function connectToServer() {
            const serverUrl = document.getElementById('serverUrl').value;
            
            if (socket) {
                socket.disconnect();
            }

            socket = io(serverUrl, {
                pingTimeout: 300000,  // 5 minutes timeout (must match server)
                pingInterval: 30000,  // Ping every 30 seconds (must match server)
                timeout: 60000,       // 1 minute connection timeout
                transports: ['polling', 'websocket'],
                upgrade: true,
                rememberUpgrade: true
            });

            socket.on('connect', function() {
                console.log('🔌 DEBUG - Socket connected successfully');
                console.log('🔌 DEBUG - Socket ID:', socket.id);
                updateConnectionStatus(true);
                addSystemEvent('Connected to VFL Virtual Soccer server');
                document.getElementById('joinBtn').disabled = false;
                
                // Initialize live match section to show "No Live Matches" status
                hideLiveMatch();
                
                // Reset event counter
                window.eventsReceived = 0;
                updateDebugInfo('Events Received', 0);
                updateDebugInfo('Connection', 'Connected');
                updateDebugInfo('Socket ID', socket.id);
            });

            socket.on('disconnect', function() {
                updateConnectionStatus(false);
                addSystemEvent('Disconnected from server');
                document.getElementById('joinBtn').disabled = true;
            });

            socket.on('joined', function(data) {
                console.log('👤 DEBUG - Client joined event:', data);
                updateDebugInfo('Client ID', data.client_id);
                updateDebugInfo('Join Time', new Date().toLocaleTimeString());
                
                currentClient = data.client_id;
                addSystemEvent(`Joined as ${data.client_id}`);
                
                if (data.playoffs) {
                    console.log('🏆 DEBUG - Received playoffs on join:', data.playoffs.length);
                    updateStats({ total_playoffs: data.playoffs.length });
                    displayPlayoffs(data.playoffs);
                    updateDebugInfo('Playoffs', data.playoffs.length);
                    
                    // TEST: Manually request events to test the connection
                    setTimeout(() => {
                        console.log('🧪 DEBUG - Testing event connection...');
                        socket.emit('request_test_event', {client_id: currentClient});
                        updateDebugInfo('Test Request', 'Sent at ' + new Date().toLocaleTimeString());
                    }, 2000);
                }
            });

            // ⚡ PURE EVENT-DRIVEN IMPLEMENTATION (NO POLLING!)
            socket.on('full_update', function(data) {
                // Initial full data on connect only - this replaces all polling
                console.log('📦 DEBUG - Full update received, data keys:', Object.keys(data));
                console.log('📦 DEBUG - Playoffs count:', data.playoffs?.length || 0);
                console.log('📦 DEBUG - Live matches:', data.playoffs?.filter(p => p.matches?.some(m => m.status === 'live')).length || 0);
                
                updateRealTimeData(data);
                addSystemEvent('⚡ Pure Event-Driven Mode Active - Sub-10ms event delivery!', false);
                console.log('📦 Full update received:', data);
            });

            socket.on('real_time_event', function(data) {
                // Instant event notifications (< 10ms latency) - this replaces polling updates
                console.log('⚡ REAL_TIME_EVENT RECEIVED:', data);
                console.log('📊 DEBUG - Event type:', data.type);
                console.log('📊 DEBUG - Event data keys:', Object.keys(data));
                
                // Add to debug panel
                updateDebugInfo('Events Received', (window.eventsReceived || 0) + 1);
                window.eventsReceived = (window.eventsReceived || 0) + 1;
                
                if (data.type === 'match_event') {
                    console.log('🥅 DEBUG - Processing match_event for match:', data.match_id);
                    handleInstantMatchEvent(data);
                } else if (data.type === 'match_start') {
                    console.log('🏁 DEBUG - Processing match_start for match:', data.match_id);
                    handleMatchStart(data);
                } else if (data.type === 'match_end') {
                    console.log('🏆 DEBUG - Processing match_end for match:', data.match_id);
                    handleMatchEnd(data);
                } else if (data.type === 'betting_opened') {
                    console.log('🎯 DEBUG - Processing betting_opened for match:', data.match_id);
                    handleBettingOpened(data);
                } else if (data.type === 'betting_locked') {
                    console.log('🔒 DEBUG - Processing betting_locked for match:', data.match_id);
                    handleBettingLocked(data);
                } else if (data.type === 'playoff_updated') {
                    console.log('📈 DEBUG - Processing playoff_updated');
                    handlePlayoffUpdated(data);
                } else if (data.type === 'playoff_betting_locked') {
                    console.log('🔐 DEBUG - Processing playoff_betting_locked');
                    handlePlayoffBettingLocked(data);
                } else if (data.type === 'playoff_finished') {
                    console.log('🏆 DEBUG - Processing playoff_finished');
                    handlePlayoffFinished(data);
                } else {
                    console.log('❓ DEBUG - Unknown event type received:', data.type);
                    addSystemEvent(`❓ Unknown event: ${data.type}`, true);
                }
                
                // Update debug info on page
                updateDebugInfo('Last Event', `${data.type} at ${new Date().toLocaleTimeString()}`);
            });

            // Test broadcast listener to debug Socket.IO routing
            socket.on('test_broadcast', function(data) {
                console.log('🧪 TEST_BROADCAST RECEIVED:', data);
                updateDebugInfo('Test Broadcast', 'Received at ' + new Date().toLocaleTimeString());
                addSystemEvent(`🧪 Test Broadcast: ${data.message}`, false);
            });

            // Emergency event listener (global broadcast test)
            socket.on('emergency_event', function(data) {
                console.log('🚨 EMERGENCY_EVENT RECEIVED:', data);
                updateDebugInfo('Emergency Event', 'Received at ' + new Date().toLocaleTimeString());
                addSystemEvent(`🚨 Emergency: ${data.message}`, false);
            });

            // Immediate test listeners (right after connection)
            socket.on('immediate_test', function(data) {
                console.log('🟢 IMMEDIATE_TEST RECEIVED:', data);
                updateDebugInfo('Immediate Test', 'SUCCESS at ' + new Date().toLocaleTimeString());
                addSystemEvent(`🟢 Immediate Test: ${data.message}`, false);
            });

            socket.on('socketio_test', function(data) {
                console.log('🔵 SOCKETIO_TEST RECEIVED:', data);
                updateDebugInfo('SocketIO Test', 'SUCCESS at ' + new Date().toLocaleTimeString());
                addSystemEvent(`🔵 SocketIO Test: ${data.message}`, false);
            });

            socket.on('global_test', function(data) {
                console.log('🌍 GLOBAL_TEST RECEIVED:', data);
                updateDebugInfo('Global Test', 'SUCCESS at ' + new Date().toLocaleTimeString());
                addSystemEvent(`🌍 Global Test: ${data.message}`, false);
            });

            // Handle direct data responses (not continuous updates)
            socket.on('playoffs_data', function(data) {
                // Response to specific playoff requests only
                const bettingPlayoffs = data.playoffs.filter(playoff => 
                    playoff.status === 'betting_open' || 
                    playoff.status === 'betting_locked' || 
                    playoff.status === 'scheduled'
                );
                
                displayPlayoffs(data.playoffs);
                updateStats({
                    total_playoffs: bettingPlayoffs.length,
                    live_playoffs: data.playoffs.filter(p => p.status === 'live').length,
                    betting_playoffs: bettingPlayoffs.filter(p => p.status === 'betting_open').length
                });
                console.log('🏆 Playoffs data received:', data);
            });

            socket.on('joined', function(data) {
                // Client successfully joined - get initial data
                addSystemEvent(`✅ Joined as ${data.client_id} - Event-driven mode active!`, false);
                
                // Display initial data from join response
                if (data.playoffs) {
                    const bettingPlayoffs = data.playoffs.filter(playoff => 
                        playoff.status === 'betting_open' || 
                        playoff.status === 'betting_locked' || 
                        playoff.status === 'scheduled'
                    );
                    
                    displayPlayoffs(data.playoffs);
                    updateStats({
                        total_playoffs: bettingPlayoffs.length,
                        live_playoffs: data.playoffs.filter(p => p.status === 'live').length,
                        betting_playoffs: bettingPlayoffs.filter(p => p.status === 'betting_open').length
                    });
                }
                console.log('👤 Client joined:', data);
            });

            socket.on('balance_data', function(data) {
                addSystemEvent(`💰 Balance: ${data.currency} ${data.balance.toFixed(2)}`, false);
            });

            socket.on('error', function(data) {
                addSystemEvent(`❌ Error: ${data.message}`, true);
                console.error('Error from server:', data);
            });
            
            // TEST: Listen for multiple test events to verify communication
            socket.on('test_event', function(data) {
                console.log('🧪 TEST EVENT received:', data);

        // Live match rotation system

        function updateRealTimeData(data) {
            // Store available live matches for rotation
            if (data.live_matches && data.live_matches.length > 0) {
                availableLiveMatches = data.live_matches;
                console.log(`📺 DEBUG - Found ${availableLiveMatches.length} live matches for rotation`);
                
                // Start match rotation system
                startLiveMatchRotation();
            } else {

                hideLiveMatch();
            }

                );
                
                updateStats({
                    total_playoffs: bettingPlayoffs.length,
                    live_playoffs: data.live_playoffs || 0,
                    betting_playoffs: bettingPlayoffs.filter(p => p.status === 'betting_open').length
                });

                // Update playoffs display
                displayPlayoffs(data.playoffs);

        function startLiveMatchRotation() {
            // Stop any existing rotation
            stopLiveMatchRotation();
            
            if (availableLiveMatches.length === 0) {
                hideLiveMatch();
                return;
            }
            
            // Show the first match immediately
            showCurrentRotationMatch();
            
            // Set up rotation every 10 seconds
            if (availableLiveMatches.length > 1) {
                matchRotationInterval = setInterval(() => {
                    rotateToNextMatch();
                }, 10000); // 10 seconds
                console.log(`🔄 DEBUG - Started live match rotation (${availableLiveMatches.length} matches, 10-second intervals)`);
            } else {
                console.log(`📺 DEBUG - Single live match, no rotation needed`);
            }
        }

        function stopLiveMatchRotation() {
            if (matchRotationInterval) {
                clearInterval(matchRotationInterval);
                matchRotationInterval = null;
                console.log(`🛑 DEBUG - Stopped live match rotation`);
            }
        }

        function rotateToNextMatch() {
            if (availableLiveMatches.length === 0) {
                hideLiveMatch();
                return;
            }
            
            // Move to next match (cycle back to 0 if at end)
            currentMatchIndex = (currentMatchIndex + 1) % availableLiveMatches.length;
            console.log(`🔄 DEBUG - Rotating to match ${currentMatchIndex + 1}/${availableLiveMatches.length}`);
            
            showCurrentRotationMatch();
            
            // Show rotation notification
            const match = availableLiveMatches[currentMatchIndex];
            addSystemEvent(`📺 Live Match Rotated: Now showing ${match.home_team.name} vs ${match.away_team.name}`, false);
        }

        function showCurrentRotationMatch() {
            if (availableLiveMatches.length === 0) {
                hideLiveMatch();
                return;
            }
            
            const match = availableLiveMatches[currentMatchIndex];
            console.log(`📺 DEBUG - Showing match ${currentMatchIndex + 1}/${availableLiveMatches.length}: ${match.home_team.name} vs ${match.away_team.name}`);
            
            showLiveMatch(match);
            
            // Add events for the current match
            if (match.events) {
                match.events.forEach(event => {
                    if (!isEventDisplayed(event)) {
                        addLiveEvent(event, match.id);
                    }
                });
            }
        }

        function showLiveMatch(match) {
            const section = document.getElementById('liveMatchSection');

            const homeTeamName = match.home_team?.name || match.home_team || 'Team A';
            const awayTeamName = match.away_team?.name || match.away_team || 'Team B';

            time.textContent = `${Math.floor(match.current_minute || 0)}'`;
            status.textContent = (match.status || 'unknown').charAt(0).toUpperCase() + (match.status || 'unknown').slice(1);

            status.style.color = '';

        let displayedEvents = new Set();

        function isEventDisplayed(event) {
            const eventKey = `${event.minute}-${event.event_type}-${event.description}`;
            return displayedEvents.has(eventKey);
        }

        function addLiveEvent(event, matchId) {
            console.log(`🔍 DEBUG addLiveEvent - Adding event to match card:`, event, `for match ${matchId}`);
            
            const eventKey = `${event.minute}-${event.event_type}-${event.description}`;
            
            if (displayedEvents.has(eventKey)) {
                console.log(`⚠️ DEBUG addLiveEvent - Event already displayed, skipping: ${eventKey}`);
                return;
            }
            
            displayedEvents.add(eventKey);
            
            // Find the match card and update its mini events display
            const matchEventsMini = document.querySelector(`.match-events-mini[data-match-id="${matchId}"]`);
            if (matchEventsMini) {
                console.log(`🔍 DEBUG addLiveEvent - Found match events mini for ${matchId}`);
                
                // Get the event icon
                const eventIcon = eventIcons[event.event_type] || '⚡';
                
                // Create mini event element
                const miniEventEl = document.createElement('span');
                miniEventEl.className = 'match-event-mini';
                miniEventEl.textContent = eventIcon;
                miniEventEl.title = `${event.minute.toFixed(1)}' - ${event.description}`;
                
                // Remove "no events" placeholder if it exists
                const noEventsEl = matchEventsMini.querySelector('.no-events');
                if (noEventsEl) {
                    noEventsEl.remove();
                }
                
                // Add new event (prepend to show most recent first)
                matchEventsMini.insertBefore(miniEventEl, matchEventsMini.firstChild);
                
                // Keep only last 3 events
                while (matchEventsMini.children.length > 3) {
                    matchEventsMini.removeChild(matchEventsMini.lastChild);
                }
                
                console.log(`✅ DEBUG addLiveEvent - Added ${eventIcon} to match ${matchId} card`);
            } else {
                console.log(`❌ DEBUG addLiveEvent - No match events mini found for ${matchId}`);
            }
        }

        function addSystemEvent(message, isError = false) {
            // Log system events to console instead of displaying in removed UI element
            const timestamp = new Date().toLocaleTimeString();
            const prefix = isError ? '❌ ERROR' : '📋 SYSTEM';
            console.log(`${prefix} [${timestamp}]: ${message}`);
        }

        function createEventElement(event, matchId) {
            const eventEl = document.createElement('div');
            const eventClass = eventClasses[event.event_type] || 'foul';
            const eventIcon = eventIcons[event.event_type] || '⚡';
            
            eventEl.className = `event-item ${eventClass}`;
            
            let detailsHtml = '';
            if (event.details) {
                const details = [];
                for (const [key, value] of Object.entries(event.details)) {
                    if (key === 'scorer' || key === 'player') {
                        details.push(`${key.charAt(0).toUpperCase() + key.slice(1)}: ${value}`);
                    } else if (key === 'referee') {
                        details.push(`👨‍⚖️ ${value}`);
                    } else if (key === 'weather') {
                        details.push(`🌤️ ${value}`);
                    } else if (key === 'stadium') {
                        details.push(`🏟️ ${value}`);
                    } else if (key === 'final_score' || key === 'half_time_score') {
                        details.push(`📊 ${key.replace('_', ' ')}: ${value}`);
                    }
                }
                if (details.length > 0) {
                    detailsHtml = `<div class="event-details">${details.join(' • ')}</div>`;
                }
            }
            
            eventEl.innerHTML = `
                <div class="event-time">${Math.floor(event.minute)}'</div>
                <div class="event-type">${eventIcon} ${event.event_type.replace('_', ' ').toUpperCase()}</div>
                <div class="event-description">${event.description}</div>
                ${detailsHtml}
            `;
            
            return eventEl;
        }

        // Event-driven handlers for instant updates (< 10ms)
        function handleInstantMatchEvent(data) {
            console.log('🔍 DEBUG handleInstantMatchEvent - Input data:', data);
            
            const event = data.event_data?.event;
            const match = data.event_data?.match;
            
            console.log('🔍 DEBUG handleInstantMatchEvent - Extracted event:', event);
            console.log('🔍 DEBUG handleInstantMatchEvent - Extracted match:', match);
            
            if (!event || !match) {
                console.error('❌ DEBUG - Missing event or match data:', { event, match });
                addSystemEvent(`❌ Missing event/match data for ${data.match_id}`, true);
                return;
            }
            
            // Add event with instant notification
            console.log('📝 DEBUG - Adding live event:', event);
            addLiveEvent(event, data.match_id);
            
            // Update live scores immediately
            console.log('🥅 DEBUG - Updating score:', data.match_id, match.home_score, match.away_score);
            updateLiveMatchScore(data.match_id, match.home_score, match.away_score);
            
            // Update match time if available
            console.log('⏰ DEBUG - Updating time:', data.match_id, match.current_minute);
            updateMatchTime(data.match_id, match.current_minute);
            
            // Update the match in rotation system if it exists
            const matchIndex = availableLiveMatches.findIndex(m => m.match_id === data.match_id);
            if (matchIndex !== -1) {
                availableLiveMatches[matchIndex].home_score = match.home_score;
                availableLiveMatches[matchIndex].away_score = match.away_score;
                availableLiveMatches[matchIndex].current_minute = match.current_minute;
                
                // If this is the currently displayed match, update the display
                if (matchIndex === currentMatchIndex) {
                    const liveSection = document.getElementById('liveMatchSection');
                    if (liveSection && liveSection.dataset.matchId === data.match_id) {
                        // Update the live match display with new data
                        showLiveMatch(availableLiveMatches[matchIndex]);
                    }
                }
            }
            
            // Show instant notification for important events
            console.log('🔔 DEBUG - Showing notification for event:', event.event_type);
            showInstantNotification(event, match);
            
            // Log for performance monitoring
            const latency = Date.now() - new Date(data.timestamp).getTime();
            console.log(`⚡ Event delivered in ${latency}ms: ${event.event_type} - ${event.description}`);
            
            // Update stats in real-time
            updateEventStats();
        }

        function handleMatchStart(data) {
            const match = data.event_data.match;
            addSystemEvent(`🟢 Match Started: ${match.home_team} vs ${match.away_team}`, false);
            
            // Update playoff betting status
            updatePlayoffBettingStatusForMatch(data.match_id, 'live', `🔴 LIVE: ${match.home_team} vs ${match.away_team}`);
            
            // Add new match to rotation system
            const liveMatchData = {
                id: data.match_id,
                match_id: data.match_id,
                home_team: { name: match.home_team },
                away_team: { name: match.away_team },
                home_score: match.home_score || 0,
                away_score: match.away_score || 0,
                current_minute: match.current_minute || 0,
                status: 'live',
                events: []
            };
            
            // Add to available matches if not already there
            const existingIndex = availableLiveMatches.findIndex(m => m.match_id === data.match_id);
            if (existingIndex === -1) {
                availableLiveMatches.push(liveMatchData);
                console.log(`📺 DEBUG - Added new live match to rotation: ${match.home_team} vs ${match.away_team} (${availableLiveMatches.length} total)`);
                
                // If this is the first live match, start rotation
                if (availableLiveMatches.length === 1) {
                    startLiveMatchRotation();
                }
            }
            
            // Performance log
            console.log(`⚡ Match start delivered at ${new Date().toISOString()}`);
        }

        function handleMatchEnd(data) {
            const match = data.event_data.match;
            addSystemEvent(`🏁 Match Ended: ${match.home_team} ${match.home_score}-${match.away_score} ${match.away_team}`, false);
            
            // Update playoff betting status
            updatePlayoffBettingStatusForMatch(data.match_id, 'finished', `🏁 Match Finished: ${match.home_team} ${match.home_score}-${match.away_score} ${match.away_team}`);
            
            // Remove finished match from rotation system
            const matchIndex = availableLiveMatches.findIndex(m => m.match_id === data.match_id);
            if (matchIndex !== -1) {
                availableLiveMatches.splice(matchIndex, 1);
                console.log(`📺 DEBUG - Removed finished match from rotation: ${match.home_team} vs ${match.away_team} (${availableLiveMatches.length} remaining)`);
                
                // Adjust current index if needed
                if (currentMatchIndex >= availableLiveMatches.length) {
                    currentMatchIndex = 0;
                }
                
                // Check if we need to show a different match or hide the display
                if (availableLiveMatches.length > 0) {
                    showCurrentRotationMatch();
                } else {
                    stopLiveMatchRotation();
                    hideLiveMatch();
                }
            }
            
            // Performance log
            console.log(`⚡ Match end delivered at ${new Date().toISOString()}`);
        }

                }
            });
        }

        function updatePlayoffBettingStatusForMatch(matchId, status, message) {
            // Find which playoff contains this match and update its betting status
            const playoffCards = document.querySelectorAll('.playoff-card');
            playoffCards.forEach(playoffEl => {
                const matchElements = playoffEl.querySelectorAll('.match-item');
                const hasMatch = Array.from(matchElements).some(matchEl => 
                    matchEl.dataset.matchId === matchId
                );
                
                if (hasMatch) {
                    let statusEl = playoffEl.querySelector('.playoff-betting-status');
                    if (!statusEl) {
                        // Create status element if it doesn't exist
                        statusEl = document.createElement('div');
                        statusEl.className = 'playoff-betting-status';
                        statusEl.style.cssText = 'margin: 8px 0; padding: 8px; border-radius: 6px; font-weight: bold; text-align: center; font-size: 0.9rem;';
                        const headerEl = playoffEl.querySelector('.playoff-header');
                        if (headerEl) {
                            headerEl.parentNode.insertBefore(statusEl, headerEl.nextSibling);
                        }
                    }
                    
                    // Update status styling and content
                    if (status === 'open') {
                        statusEl.style.backgroundColor = '#e8f5e8';
                        statusEl.style.color = '#2d5a2d';
                        statusEl.style.border = '2px solid #4caf50';
                    } else if (status === 'locked') {
                        statusEl.style.backgroundColor = '#fff3e0';
                        statusEl.style.color = '#e65100';
                        statusEl.style.border = '2px solid #ff9800';
                    } else if (status === 'live') {
                        statusEl.style.backgroundColor = '#ffebee';
                        statusEl.style.color = '#c62828';
                        statusEl.style.border = '2px solid #f44336';
                        statusEl.style.animation = 'pulse 2s infinite';
                    } else if (status === 'finished') {
                        statusEl.style.backgroundColor = '#f3e5f5';
                        statusEl.style.color = '#4a148c';
                        statusEl.style.border = '2px solid #9c27b0';
                    }
                    
                    statusEl.textContent = message;
                    statusEl.title = `Updated at ${new Date().toLocaleTimeString()}`;
                }
            });
        }

        function updatePlayoffBettingStatus(playoffId, status, timeData = null) {
            // Update playoff betting status
            const playoffCards = document.querySelectorAll('.playoff-card');
            playoffCards.forEach(playoffEl => {
                if (playoffEl.dataset.playoffId === playoffId) {
                    let statusEl = playoffEl.querySelector('.playoff-betting-status');
                    if (!statusEl) {
                        // Create status element if it doesn't exist
                        statusEl = document.createElement('div');
                        statusEl.className = 'playoff-betting-status';
                        statusEl.style.cssText = 'margin: 8px 0; padding: 8px; border-radius: 6px; font-weight: bold; text-align: center;';
                        const headerEl = playoffEl.querySelector('.playoff-header');
                        if (headerEl) {
                            headerEl.parentNode.insertBefore(statusEl, headerEl.nextSibling);
                        }
                    }
                    
                    if (status === 'betting_open') {
                        statusEl.textContent = '🎲 PLACE BETS NOW!';
                        statusEl.style.backgroundColor = '#22c55e';
                        statusEl.style.color = 'white';
                        statusEl.style.animation = 'pulse 2s infinite';
                        
                        // Start countdown if time data is available
                        if (timeData && timeData.betting_lock_time) {
                            startBettingCountdown(playoffEl, timeData.betting_lock_time, 'betting');
                        }
                    } else if (status === 'betting_locked') {
                        statusEl.textContent = '🔒 BETTING LOCKED - Starting Soon!';
                        statusEl.style.backgroundColor = '#ef4444';
                        statusEl.style.color = 'white';
                        statusEl.style.animation = 'flash 1s infinite';
                        
                        // Start countdown to match start
                        if (timeData && timeData.scheduled_start_time) {
                            startBettingCountdown(playoffEl, timeData.scheduled_start_time, 'starting');
                        }
                    } else if (status === 'live') {
                        statusEl.textContent = '🏁 MATCHES LIVE!';
                        statusEl.style.backgroundColor = '#3b82f6';
                        statusEl.style.color = 'white';
                        statusEl.style.animation = 'none';
                        
                        // Clear any countdown
                        clearBettingCountdown(playoffEl);
                    }
                }
            });
        }

        function startBettingCountdown(playoffEl, targetTime, type) {
            // Clear any existing countdown
            clearBettingCountdown(playoffEl);
            
            const countdownEl = document.createElement('div');
            countdownEl.className = 'betting-countdown';
            countdownEl.style.cssText = 'font-size: 0.9rem; margin-top: 4px; opacity: 0.9;';
            
            const statusEl = playoffEl.querySelector('.playoff-betting-status');
            if (statusEl) {
                statusEl.appendChild(countdownEl);
            }
            
            const countdownInterval = setInterval(() => {
                const now = new Date();
                const target = new Date(targetTime);
                const diff = target - now;
                
                if (diff <= 0) {
                    clearInterval(countdownInterval);
                    countdownEl.textContent = type === 'betting' ? 'Locking...' : 'Starting...';
                    return;
                }
                
                const seconds = Math.ceil(diff / 1000);
                const label = type === 'betting' ? 'Betting ends in' : 'Starting in';
                countdownEl.textContent = `${label}: ${seconds}s`;
            }, 1000);
            
            // Store interval ID for cleanup
            playoffEl._countdownInterval = countdownInterval;
        }

        function clearBettingCountdown(playoffEl) {
            if (playoffEl._countdownInterval) {
                clearInterval(playoffEl._countdownInterval);
                playoffEl._countdownInterval = null;
            }
            const countdownEl = playoffEl.querySelector('.betting-countdown');
            if (countdownEl) {
                countdownEl.remove();
            }
        }

        function updatePlayoffStats(playoffData) {
            // Find and update playoff in the UI
            const playoffCards = document.querySelectorAll('.playoff-card');
            playoffCards.forEach(card => {
                if (card.dataset.playoffId === playoffData.playoff_id) {
                    // Update total goals
                    const goalsEl = card.querySelector('.playoff-goals');
                    if (goalsEl) {
                        goalsEl.textContent = playoffData.total_goals;
                        // Add animation for goal changes
                        goalsEl.style.transform = 'scale(1.2)';
                        goalsEl.style.color = '#FFD700';
                        setTimeout(() => {
                            goalsEl.style.transform = 'scale(1)';
                            goalsEl.style.color = '';
                        }, 500);
                    }
                    
                    // Update total events
                    const eventsEl = card.querySelector('.playoff-events');
                    if (eventsEl) {
                        eventsEl.textContent = playoffData.total_events;
                    }
                    
                    // Update live matches count
                    const liveMatchesEl = card.querySelector('.playoff-live-matches');
                    if (liveMatchesEl) {
                        liveMatchesEl.textContent = playoffData.live_matches;
                    }
                    
                    // Update status
                    const statusEl = card.querySelector('.playoff-status');
                    if (statusEl) {
                        statusEl.textContent = playoffData.status.charAt(0).toUpperCase() + playoffData.status.slice(1);
                    }
                    
                    // Add visual feedback for update
                    card.style.boxShadow = '0 0 20px rgba(255, 215, 0, 0.6)';
                    setTimeout(() => {
                        card.style.boxShadow = '';
                    }, 1000);
                }
            });
            
            // Update global stats if displayed
            const totalGoalsEl = document.getElementById('totalGoals');
            const totalEventsEl = document.getElementById('totalEvents');
            
            if (totalGoalsEl || totalEventsEl) {
                // Recalculate totals across all playoffs
                let globalGoals = 0;
                let globalEvents = 0;
                
                playoffCards.forEach(card => {
                    const goals = parseInt(card.querySelector('.playoff-goals')?.textContent || '0');
                    const events = parseInt(card.querySelector('.playoff-events')?.textContent || '0');
                    globalGoals += goals;
                    globalEvents += events;
                });
                
                if (totalGoalsEl) totalGoalsEl.textContent = globalGoals;
                if (totalEventsEl) totalEventsEl.textContent = globalEvents;
            }
        }

        function showInstantNotification(event, match) {
            // Create floating notification for important events
            if (event.event_type === 'goal' || event.event_type === 'red_card') {
                const notification = document.createElement('div');
                notification.className = 'instant-notification';
                notification.innerHTML = `
                    <div class="notification-content">
                        ${getEventIcon(event.event_type)} ${event.description}
                        <div class="notification-time">LIVE</div>
                    </div>
                `;
                
                // Add styles for notification
                notification.style.cssText = `
                    position: fixed;
                    top: 20px;
                    right: 20px;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    color: white;
                    padding: 15px 20px;
                    border-radius: 10px;
                    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
                    z-index: 10000;
                    transform: translateX(100%);
                    transition: transform 0.3s ease;
                `;
                
                document.body.appendChild(notification);
                
                // Animate in
                setTimeout(() => {
                    notification.style.transform = 'translateX(0)';
                }, 100);
                
                // Remove after 3 seconds
                setTimeout(() => {
                    notification.style.transform = 'translateX(100%)';
                    setTimeout(() => {
                        document.body.removeChild(notification);
                    }, 300);
                }, 3000);
            }
        }

        function updateStats(stats) {
            if (stats.total_playoffs !== undefined) {
                document.getElementById('totalPlayoffs').textContent = stats.total_playoffs;
            }
            if (stats.live_playoffs !== undefined) {
                document.getElementById('livePlayoffs').textContent = stats.live_playoffs;
            }
            if (stats.total_events !== undefined) {
                document.getElementById('totalEvents').textContent = stats.total_events;
            }
            if (stats.total_goals !== undefined) {
                document.getElementById('totalGoals').textContent = stats.total_goals;
            }
        }
        
        function updateDebugInfo(label, value) {
            let debugEl = document.getElementById('debugInfo');
            if (!debugEl) {
                // Create debug info element if it doesn't exist
                debugEl = document.createElement('div');
                debugEl.id = 'debugInfo';
                debugEl.style.cssText = `
                    position: fixed;
                    top: 10px;
                    right: 10px;
                    background: rgba(0,0,0,0.8);
                    color: #00ff00;
                    padding: 10px;
                    border-radius: 5px;
                    font-family: monospace;
                    font-size: 12px;
                    z-index: 1000;
                    max-width: 300px;
                `;
                document.body.appendChild(debugEl);
            }
            
            // Update or add debug line
            const lines = debugEl.innerHTML.split('<br>').filter(line => !line.includes(label + ':'));
            lines.push(`${label}: ${value}`);
            if (lines.length > 10) lines.shift(); // Keep only last 10 lines
            debugEl.innerHTML = lines.join('<br>');
        }

        function displayPlayoffs(playoffs) {
            const section = document.getElementById('playoffsSection');
            section.style.display = 'grid';
            section.innerHTML = '';
            
            // Filter to only show betting-eligible playoffs (betting_open, betting_locked, or scheduled)
            const bettingPlayoffs = playoffs.filter(playoff => 
                playoff.status === 'betting_open' || 
                playoff.status === 'betting_locked' || 
                playoff.status === 'scheduled'
            );
            
            console.log(`🎲 DEBUG - Filtering playoffs: ${playoffs.length} total → ${bettingPlayoffs.length} betting-eligible`);
            console.log(`🎲 DEBUG - Betting playoffs statuses:`, bettingPlayoffs.map(p => `${p.name}: ${p.status}`));
            
            if (bettingPlayoffs.length === 0) {
                section.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #666; font-style: italic;">
                        <h3>🎲 No Betting Available</h3>
                        <p>All playoffs are currently live or finished. New betting opportunities coming soon!</p>
                    </div>
                `;
                return;
            }
            
            bettingPlayoffs.slice(0, 6).forEach(playoff => { // Show first 6 betting playoffs
                const playoffEl = document.createElement('div');
                playoffEl.className = 'playoff-card';
                playoffEl.dataset.playoffId = playoff.id; // Add data attribute for live updates
                
                const matchesHtml = playoff.matches.map(match => {
                    const homeTeamName = match.home_team?.name || match.home_team || 'Team A';
                    const awayTeamName = match.away_team?.name || match.away_team || 'Team B';
                    const homeScore = match.home_score || 0;
                    const awayScore = match.away_score || 0;
                    
                    // Get recent events for this match (last 3 events)
                    const recentEvents = (match.events || []).slice(-3);
                    const eventsHtml = recentEvents.map(event => {
                        const eventIcon = eventIcons[event.event_type] || '⚡';
                        return `<span class="match-event-mini" title="${event.description}">${eventIcon}</span>`;
                    }).join('');
                    
                    return `
                        <div class="playoff-match" data-match-id="${match.id || ''}">
                            <div class="match-info">
                                <span class="match-teams">${homeTeamName} vs ${awayTeamName}</span>
                                <span class="playoff-score">${homeScore}-${awayScore}</span>
                            </div>
                            <div class="match-events-mini" data-match-id="${match.id || ''}">
                                ${eventsHtml || '<span class="no-events">—</span>'}
                            </div>
                        </div>
                    `;
                }).join('');
                
                playoffEl.innerHTML = `
                    <div class="playoff-header">${playoff.name}</div>
                    <div style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 12px;">
                        <span class="playoff-status">${playoff.status}</span> • 
                        Goals: <span class="playoff-goals">${playoff.total_goals || 0}</span> • 
                        Events: <span class="playoff-events">${playoff.total_events || 0}</span> •
                        Live: <span class="playoff-live-matches">${playoff.live_matches || 0}</span>
                    </div>
                    ${matchesHtml}
                `;
                
                section.appendChild(playoffEl);
                
                // Set initial betting status based on playoff status
                setTimeout(() => {
                    const timeData = {
                        betting_lock_time: playoff.betting_lock_time,
                        scheduled_start_time: playoff.scheduled_start_time
                    };
                    
                    if (playoff.status === 'betting_open') {
                        updatePlayoffBettingStatus(playoff.id, 'betting_open', timeData);
                    } else if (playoff.status === 'betting_locked') {
                        updatePlayoffBettingStatus(playoff.id, 'betting_locked', timeData);
                    } else if (playoff.status === 'live') {
                        updatePlayoffBettingStatus(playoff.id, 'live', timeData);
                    }
                }, 100);
            });
        }

        // Auto-connect on page load
        window.addEventListener('load', function() {
            // Auto-connect for demo purposes
            setTimeout(() => {
                connectToServer();
            }, 1000);
        });
    </script>
